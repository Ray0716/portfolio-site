{{ define "main" }}
<article>
	<h1 class="page-title">{{ .Title }}</h1>
	{{ with .Content }}<div class="c-rich-text">{{ . }}</div>{{ end }}
	<ul class="project-list">
		{{ range .Pages.ByWeight }}
		<li>
			<a class="project-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
			{{ with .Description }}<p class="project-desc">{{ . }}</p>{{ end }}
		</li>
		{{ end }}
	</ul>
</article>
{{ end }}
