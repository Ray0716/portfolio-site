{{ define "main" }}
<article>
	<h1 class="page-title">{{ .Title }}</h1>
	<div class="c-rich-text">
		{{- .Content -}}
	</div>

	<ul class="social">
		{{ range $name, $url := site.Params.social }}
		<li>
			<a class="icon" href="{{ $url }}" target="_blank" rel="noopener" title="{{ $name }}" aria-label="{{ $name }}">
				{{ partial (printf "svg/%s-line.svg" $name) . }}
			</a>
		</li>
		{{ end }}
	</ul>

	<form class="contact-form" action="{{ site.Params.contact.formAction }}" method="POST">
		<label for="name">Name</label>
		<input id="name" name="name" type="text" required autocomplete="name">

		<label for="email">Email</label>
		<input id="email" name="email" type="email" required autocomplete="email">

		<label for="message">Message</label>
		<textarea id="message" name="message" rows="6" required></textarea>

		{{/* Spam trap: real visitors never see or fill this */}}
		<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">

		<button type="submit">Send</button>
	</form>
</article>
{{ end }}
